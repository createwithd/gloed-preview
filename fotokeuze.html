<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fotokeuze pellethaard</title>
<style>:root{--bg:#16110d;--fg:#f3ece4;--mut:#b7a99a;--acc:#ff7a1a}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
.w{max-width:1300px;margin:0 auto;padding:24px 16px 120px}h1{margin:0 0 6px}p{color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.c{background:#221a14;border:2px solid #33271e;border-radius:10px;overflow:hidden;cursor:pointer;display:grid}
.c img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.c span{padding:8px 10px;font-weight:600}
.c:has(input:checked){border-color:var(--acc)}input{accent-color:var(--acc);width:18px;height:18px;vertical-align:-3px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0e0a07;border-top:1px solid #33271e;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar code{flex:1;min-width:0;color:var(--acc);overflow-wrap:anywhere}button{background:var(--acc);color:#16110d;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}</style></head>

<script>const boxes=[...document.querySelectorAll('input')];function upd(){const v=boxes.filter(b=>b.checked).map(b=>b.value);document.getElementById('n').textContent=v.length+' gekozen';document.getElementById('out').textContent=v.length?'Wel: '+v.join(', '):'Nog niks gekozen'}boxes.forEach(b=>b.addEventListener('change',upd));document.getElementById('cp').onclick=()=>{const t=document.getElementById('out').textContent;navigator.clipboard.writeText(t).then(()=>{document.getElementById('cp').textContent='Gekopieerd'}).catch(()=>{})}</script></body></html>
