<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Clipkeuze Flametower</title>
<style>:root{--bg:#16110d;--fg:#f3ece4;--mut:#b7a99a;--acc:#ff7a1a;--night:oklch(0.17 0.014 48)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}.w{max-width:1500px;margin:0 auto;padding:24px 16px 110px}p{color:var(--mut);max-width:760px}
h2{margin:34px 0 12px;padding-top:12px;border-top:1px solid #33271e}h2 small{color:var(--mut);font-weight:400;font-size:.7em}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.c{display:grid;gap:8px;cursor:pointer}
/* exact hetzelfde kader als de productgalerij op de site */
.main{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--night);box-shadow:0 40px 120px -30px oklch(0.62 0.2 38 / .55),0 0 0 1px oklch(0.72 0.185 48 / .25);border:3px solid transparent}
.main video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c:has(input:checked) .main{border-color:var(--acc)}
.c span{font-weight:600;font-size:.95em}.dl{font-weight:400!important}.dl a{color:var(--acc)}input{accent-color:var(--acc);width:18px;height:18px;vertical-align:-3px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0e0a07;border-top:1px solid #33271e;padding:12px 16px;display:flex;gap:12px;align-items:center}.bar code{flex:1;color:var(--acc)}
button{background:var(--acc);color:#16110d;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}</style></head>
<body><div class="w"><h1>Clipkeuze Flametower</h1><p>Echte beelden, niet gestabiliseerd en zonder overvloei: alleen het stuk waarin de hoed in beeld is, boven de ondertitel afgeknipt. Zelfde 4:5-kader als je productgalerij, 1080×1350.</p><div class="g"><label class="c"><div class="main"><video src="puur/L1.mp4" poster="puur/L1.jpg" muted loop playsinline autoplay preload="metadata"></video></div>
<span><input type="checkbox" value="L1"> L1 · Zonsondergang aan het meer, hoge vlam</span><span class="dl"><a href="puur/L1.mp4" download="L1-1080x1350.mp4">MP4</a> · <a href="puur/L1.gif" download="L1.gif">GIF</a></span></label><label class="c"><div class="main"><video src="puur/L4.mp4" poster="puur/L4.jpg" muted loop playsinline autoplay preload="metadata"></video></div>
<span><input type="checkbox" value="L4"> L4 · Hoed met vlammen, close-up</span><span class="dl"><a href="puur/L4.mp4" download="L4-1080x1350.mp4">MP4</a> · <a href="puur/L4.gif" download="L4.gif">GIF</a></span></label><label class="c"><div class="main"><video src="puur/L5.mp4" poster="puur/L5.jpg" muted loop playsinline autoplay preload="metadata"></video></div>
<span><input type="checkbox" value="L5"> L5 · Stoelen aan het water</span><span class="dl"><a href="puur/L5.mp4" download="L5-1080x1350.mp4">MP4</a> · <a href="puur/L5.gif" download="L5.gif">GIF</a></span></label><label class="c"><div class="main"><video src="puur/L8.mp4" poster="puur/L8.jpg" muted loop playsinline autoplay preload="metadata"></video></div>
<span><input type="checkbox" value="L8"> L8 · Camera omhoog naar de hoed, aan het water</span><span class="dl"><a href="puur/L8.mp4" download="L8-1080x1350.mp4">MP4</a> · <a href="puur/L8.gif" download="L8.gif">GIF</a></span></label></div></div><div class="bar"><code id="o">Nog niets gekozen</code><button id="cp" type="button">Kopieer keuze</button></div>
<script>const o=document.getElementById('o');document.addEventListener('change',()=>{const v=[...document.querySelectorAll('input:checked')].map(i=>i.value);o.textContent=v.length?'Clips: '+v.join(', '):'Nog niets gekozen';});
document.getElementById('cp').addEventListener('click',()=>{try{navigator.clipboard.writeText(o.textContent)}catch(e){}document.getElementById('cp').textContent='Gekopieerd';setTimeout(()=>document.getElementById('cp').textContent='Kopieer keuze',1500);});</script></body></html>
